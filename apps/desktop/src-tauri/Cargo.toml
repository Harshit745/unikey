[package]
name = "unikey-desktop"
version = "0.1.0"
description = "UniKey — one keyboard, one clipboard, one workspace across every device."
authors = ["Harshit Sharma"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# Keep the binary small — the daemon is embedded inside and doubles the size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "macros", "rt"] }
dirs = "6"
uuid = "1"

[lib]
name = "unikey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
