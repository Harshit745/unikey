name: UniKey Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'
  DAEMON_PORT: 45895
  # Invalidate cached build metadata for every source revision.
  UNIKEY_OVERRIDE_COMMIT: ${{ github.sha }}

jobs:
  # ── macOS build ────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend and type-check
        working-directory: apps/desktop
        run: npm run build

      - name: Build daemon
        run: cargo build --release --bin daemon

      - name: Stage embedded daemon
        run: cp target/release/daemon apps/desktop/src-tauri/unikey-daemon.bin

      - name: Build desktop app (universal macOS binary)
        working-directory: apps/desktop
        run: npx tauri build --target universal-apple-darwin

      - name: Stage downloadable macOS image
        run: |
          mkdir -p release-artifacts
          DMG="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" release-artifacts/UniKey-macOS-universal.dmg

      - name: Run integration tests
        working-directory: apps/desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniKey-macOS-universal
          path: release-artifacts/UniKey-macOS-universal.dmg
          retention-days: 30

  # ── Windows build ──────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend and type-check
        working-directory: apps/desktop
        run: npm run build

      - name: Run Rust tests (Windows)
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Run desktop shell tests (Windows)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build daemon (Windows)
        run: cargo build --release --bin daemon --target x86_64-pc-windows-msvc

      - name: Stage embedded daemon
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/daemon.exe apps/desktop/src-tauri/unikey-daemon.bin

      - name: Build NSIS installer (Windows)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --target x86_64-pc-windows-msvc

      - name: Stage downloadable Windows installer
        shell: pwsh
        run: |
          # Never recursively select from target/: the Rust cache can contain
          # an older installer under target/release alongside this target build.
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $installer = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/$($config.productName)_$($config.version)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing installer from this build: $installer" }
          Write-Host "Staging exact target installer: $installer"
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination "release-artifacts/UniKey-Setup.exe"
          $hash = (Get-FileHash "release-artifacts/UniKey-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UniKey-Setup.exe" | Set-Content -NoNewline "release-artifacts/UniKey-Setup.exe.sha256"

      - name: Smoke-test install, launch, daemon lifecycle, and uninstall
        shell: pwsh
        run: >-
          .\scripts\windows\installer-smoke.ps1
          -InstallerPath .\release-artifacts\UniKey-Setup.exe
          -ExpectedCommit $env:GITHUB_SHA
          -ExpectedDaemonPath .\target\x86_64-pc-windows-msvc\release\daemon.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniKey-Windows-x64
          path: |
            release-artifacts/UniKey-Setup.exe
            release-artifacts/UniKey-Setup.exe.sha256
          retention-days: 30

  # ── Cross-platform test (daemon only) ─────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/daemon

      - name: Build daemon
        run: cargo build --release --bin daemon

      - name: Run daemon tests
        run: cargo test --release

      - name: Start daemon and verify endpoints
        run: |
          ./target/release/daemon &
          DAEMON_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:${{ env.DAEMON_PORT }}/health >/dev/null 2>&1; then
              echo "Daemon healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:${{ env.DAEMON_PORT }}/health
          curl -sf http://127.0.0.1:${{ env.DAEMON_PORT }}/version
          curl -sf http://127.0.0.1:${{ env.DAEMON_PORT }}/services
          # Discovery endpoint returns the {success,data,error} envelope.
          curl -sf http://127.0.0.1:${{ env.DAEMON_PORT }}/api/v1/peers
          kill $DAEMON_PID || true

  # ── Tagged build → durable, user-facing GitHub Release downloads ─────
  release:
    name: Publish desktop installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: UniKey-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
